[package]
include = [
  "/Cargo.toml",
  "/Cargo.lock",
  "/src/**",
  "/schema/**",
  "/README.md",
  "/LICENSE",
  "/.cargo/config.toml",
  "!/src/bin/**",
  "!/src/processor/tests.rs",
]
name = "uncomment"
version = "3.10.3"
authors = ["Na'aman Hirschfeld <nhirschfeld@gmail.com>"]
description = "A CLI tool to remove comments from code using tree-sitter for accurate parsing"
edition = "2024"
# ~keep tree-sitter 0.27 requires Rust 1.90, above the edition 2024 minimum.
rust-version = "1.90"
categories = ["command-line-utilities", "development-tools"]
keywords = ["comments", "cli", "tree-sitter", "ast"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/Goldziher/uncomment"
homepage = "https://github.com/Goldziher/uncomment"

# ~keep cargo-binstall metadata: fetch prebuilt archives from GitHub releases.
# ~keep archive-suffix resolves to .tar.gz on unix and .zip on windows, matching our release assets.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/uncomment-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"

[lib]
name = "uncomment"
path = "src/lib.rs"

[[bin]]
name = "uncomment"
path = "src/main.rs"

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"
required-features = ["bench-tools"]

[[bin]]
name = "profile"
path = "src/bin/profile.rs"
required-features = ["bench-tools"]

[features]
default = []
bench-tools = []

[dependencies]
ahash = "0.8"
anstream = "1.0"
anyhow = "1.0.104"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive", "color", "wrap_help"] }
dirs = "7.0"
glob = "0.3.4"
globset = "0.4.20"
ignore = "0.4.33"
indicatif = "0.18"
memchr = "2"
num_cpus = "1.17"
once_cell = "1.21.4"
owo-colors = "4"
rayon = "1.12.0"
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.8"
tree-sitter = "0.27.1"
tree-sitter-language-pack = "1.21.1"
walkdir = "2.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[dev-dependencies]
# ~keep only tests/schema_test.rs validates the published config schema; keep it out of the binary.
# ~keep the default HTTP/TLS resolution features drag in reqwest and a native TLS backend; the schema
# ~keep resolves nothing over the network, so only in-document `$ref`s need to work.
jsonschema = { version = "0.58", default-features = false }
pretty_assertions = "1.4"
# ~keep only tests/uncomment_integration.rs parses YAML; keep it out of the shipped binary.
saphyr = "0.2.2"
tempfile = "3.27.0"
