[package]
name = "uncomment"
version = "3.5.2"
authors = ["Na'aman Hirschfeld <nhirschfeld@gmail.com>"]
description = "A CLI tool to remove comments from code using tree-sitter for accurate parsing"
edition = "2024"
keywords = ["comments", "cli", "tree-sitter", "ast"]
license = "MIT"
repository = "https://github.com/Goldziher/uncomment"

# ~keep cargo-binstall metadata: fetch prebuilt archives from GitHub releases.
# ~keep archive-suffix resolves to .tar.gz on unix and .zip on windows, matching our release assets.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/uncomment-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"

[lib]
name = "uncomment"
path = "src/lib.rs"

[[bin]]
name = "uncomment"
path = "src/main.rs"

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"
required-features = ["bench-tools"]

[[bin]]
name = "profile"
path = "src/bin/profile.rs"
required-features = ["bench-tools"]

[features]
default = []
bench-tools = []

[dependencies]
ahash = "0.8"
anstream = "1.0"
anyhow = "1.0.104"
clap = { version = "4.6", features = ["derive", "color", "wrap_help"] }
dirs = "6.0"
glob = "0.3.4"
ignore = "0.4.31"
indicatif = "0.18"
memchr = "2"
num_cpus = "1.17"
once_cell = "1.21.4"
owo-colors = "4"
rayon = "1.12.0"
saphyr = "0.0.11"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1.4"
tree-sitter = "0.26.11"
tree-sitter-language-pack = "1.13.7"
walkdir = "2.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.27.0"
