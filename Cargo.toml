[package]
include = [
  "/Cargo.toml",
  "/Cargo.lock",
  "/src/**",
  "/schema/**",
  "/README.md",
  "/LICENSE",
  "/.cargo/config.toml",
  "!/src/bin/**",
  "!/src/processor/tests.rs",
]
name = "uncomment"
version = "3.10.4"
authors = ["Na'aman Hirschfeld <nhirschfeld@gmail.com>"]
description = "A CLI tool to remove comments from code using tree-sitter for accurate parsing"
edition = "2024"
rust-version = "1.99"
categories = ["command-line-utilities", "development-tools"]
keywords = ["comments", "cli", "tree-sitter", "ast"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/Goldziher/uncomment"
homepage = "https://github.com/Goldziher/uncomment"

# ~keep cargo-binstall metadata: fetch prebuilt archives from GitHub releases.
# ~keep archive-suffix resolves to .tar.gz on unix and .zip on windows, matching our release assets.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/uncomment-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"

[lib]
name = "uncomment"
path = "src/lib.rs"

[[bin]]
name = "uncomment"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"
required-features = ["bench-tools"]

[[bin]]
name = "profile"
path = "src/bin/profile.rs"
required-features = ["bench-tools"]

[features]
default = ["cli"]
# ~keep the command-line front end: the binary, argument parsing, the directory walk and its rayon
# ~keep parallelism, and the subcommands (lint, scan, keep, check, init). Library consumers that only
# ~keep need the per-file `Processor` API build with `default-features = false`.
cli = [
  "dep:blake3",
  "dep:clap",
  "dep:glob",
  "dep:ignore",
  "dep:indicatif",
  "dep:libc",
  "dep:num_cpus",
  "dep:rayon",
  "dep:serde_json",
  "dep:walkdir",
]
bench-tools = ["cli"]

[dependencies]
ahash = "0.8"
anstream = "1.0"
anyhow = "1.0.104"
blake3 = { version = "1.8", optional = true }
clap = { version = "4.6", features = ["derive", "color", "wrap_help"], optional = true }
dirs = "7.0"
glob = { version = "0.3.4", optional = true }
globset = "0.4.21"
ignore = { version = "0.4.34", optional = true }
indicatif = { version = "0.18", optional = true }
memchr = "2"
num_cpus = { version = "1.17", optional = true }
once_cell = "1.21.4"
owo-colors = "4"
rayon = { version = "1.12.0", optional = true }
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
toml = "1.1.8"
tree-sitter = "0.27.1"
tree-sitter-language-pack = "1.23.1"
walkdir = { version = "2.5", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.191", optional = true }

[dev-dependencies]
# ~keep only tests/schema_test.rs validates the published config schema; keep it out of the binary.
# ~keep the default HTTP/TLS resolution features drag in reqwest and a native TLS backend; the schema
# ~keep resolves nothing over the network, so only in-document `$ref`s need to work.
jsonschema = { version = "0.60", default-features = false }
pretty_assertions = "1.4"
# ~keep only tests/uncomment_integration.rs parses YAML; keep it out of the shipped binary.
saphyr = "0.3.3"
tempfile = "3.27.0"
