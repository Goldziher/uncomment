version: "3"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  setup:
    desc: "Install all dependencies and initialize project. Idempotent."
    cmds:
      - cargo fetch
      - task: ai:hooks
      - echo "Setup complete"

  build:
    desc: Build the uncomment binary
    cmds:
      - cargo build --release

  test:
    desc: Run all tests
    cmds:
      - cargo test

  test:verbose:
    desc: Run tests with verbose output
    cmds:
      - cargo test -- --nocapture

  lint:
    desc: Lint the repository with Poly
    cmds:
      - poly lint .

  format:
    desc: Format code
    cmds:
      - poly fmt --fix .

  check:
    desc: Run all checks (lint + test)
    cmds:
      - task: lint
      - task: test

  clean:
    desc: Clean build artifacts
    cmds:
      - cargo clean

  update:
    desc: Update dependencies
    cmds:
      - cargo update
      - poly hooks update
      - poly hooks install

  ai:hooks:
    desc: Install governance hooks while preserving local preferences
    cmds:
      - >-
        python3 -c 'from pathlib import Path;
        p = Path("poly.local.toml");
        p.exists() or p.write_text("[hook_preferences]\nchannels = [\"system\"]\n")'
      - poly hooks update
      - poly hooks install

  ai:validate:
    desc: Validate both native governance configurations and plugin exports
    cmds:
      - ai-rulez migrate okf --check
      - ai-rulez -C plugin/.ai-rulez migrate okf --check
      - ai-rulez validate --strict --no-local
      - ai-rulez -C plugin/.ai-rulez validate --strict --no-local
      - ai-rulez lock --recursive --check
      - ai-rulez generate --no-local --strict-config --check
      - ai-rulez verify --plugin
      - python3 scripts/sync_plugin_version.py --check
      - python3 scripts/sync_public_skills.py --check

  plugin:generate:
    desc: Generate all runtime plugins and portable public skills
    cmds:
      - python3 scripts/sync_plugin_version.py
      - ai-rulez -C plugin/.ai-rulez lock --content-only
      - ai-rulez generate --plugin --no-local --strict-config
      - python3 scripts/sync_public_skills.py
      - ai-rulez lock --content-only
      - ai-rulez generate --no-local
