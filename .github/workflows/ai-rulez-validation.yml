name: AI-Rulez validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/setup-ai-rulez@v1
      - uses: xberg-io/actions/validate-ai-rulez@v1
        with:
          expected-config-count: "2"
          additional-config-directories: plugin/.ai-rulez
          verify-plugin: "true"
      - uses: xberg-io/actions/setup-mise@v1
        with:
          tools: node uv
      - name: Verify public skills, runtime registrations and versions
        run: |
          python3 scripts/sync_plugin_version.py --check
          python3 scripts/sync_public_skills.py --check
          python3 scripts/tests/test_public_skills.py
          python3 scripts/tests/test_plugin_version.py
          node --test scripts/tests/plugin-skills.test.mjs
      - name: Verify native Pi and OpenCode SDK contracts
        run: |
          npm install --prefix .native/sdk --ignore-scripts --no-package-lock @opencode/plugin@2.0.26 @earendil-works/pi-coding-agent@1.2.0 effect@4.0.0-rc.112
          node --test scripts/tests/native-skills.test.mjs
      - name: Check out the pinned Hermes plugin SDK
        uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          ref: caf557be5b4c9ae75b3a7566d65d3df2c701c5df
          path: .native/hermes
      - name: Build and strictly validate the Hermes wheel
        shell: bash
        run: |
          set -euo pipefail
          wheel_directory="$(mktemp -d)"
          test -n "$wheel_directory"
          uv build --wheel --out-dir "$wheel_directory" plugin/.hermes/package
          mapfile -t wheels < <(find "$wheel_directory" -maxdepth 1 -type f -name '*.whl')
          test "${#wheels[@]}" -eq 1
          uvx --from twine==7.0.0 --with packaging==26.3 twine check --strict "${wheels[0]}"
      - name: Verify actual Hermes skill discovery
        env:
          PYTHONPATH: ${{ github.workspace }}/.native/hermes
        run: uv run --no-project --python 3.11 --with PyYAML==6.0.3 python scripts/tests/test_hermes_skills.py
