name: Publish Packages

on:
  push:
    tags:
      - v[0-9]+.*
  workflow_dispatch:
    inputs:
      plugins-only:
        description: "Publish current main plugin packages only; skip existing versions"
        type: boolean
        default: false
      tag:
        description: "Release tag to publish (e.g., v3.1.0)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  plugin-meta:
    name: Verify plugin-only dispatch metadata
    if: inputs.plugins-only
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Read consistent current plugin versions
        id: version
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          if os.environ['DISPATCH_REF'] != 'refs/heads/main':
              raise SystemExit('Plugin-only publishing requires main')
          cargo = tomllib.loads(Path('Cargo.toml').read_text())
          core = cargo.get('workspace', {}).get('package', cargo.get('package', {}))['version']
          npm = json.loads(Path('plugin/package.json').read_text())['version']
          hermes = tomllib.loads(Path('plugin/.hermes/package/pyproject.toml').read_text())['project']['version']
          if not core or core != npm or core != hermes:
              raise SystemExit(f'Plugin versions disagree: core={core}, npm={npm}, Hermes={hermes}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={core}\n')
          PY

  meta:
    if: ${{ !inputs.plugins-only }}
    name: Resolve versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      python_version: ${{ steps.version.outputs.python_version }}
      tag: ${{ steps.version.outputs.tag }}
      crates_exists: ${{ steps.published.outputs.crates_exists }}
      npm_exists: ${{ steps.published.outputs.npm_exists }}
      pypi_exists: ${{ steps.published.outputs.pypi_exists }}
      release_assets_exist: ${{ steps.release_assets.outputs.release_assets_exist }}
    steps:
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "12.11.2"
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi

          version="${tag#v}"
          python_version="$(echo "$version" | sed 's/-rc\.//g; s/-rc/rc/')"

          {
            echo "version=$version"
            echo "python_version=$python_version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

          echo "Git tag: $tag"
          echo "Cargo/npm version: $version"
          echo "Python version: $python_version"

      - name: Verify version consistency across all surfaces
        run: |
          set -euo pipefail
          target_version="${{ steps.version.outputs.version }}"
          target_python_version="${{ steps.version.outputs.python_version }}"

          echo "Verifying version consistency for: $target_version (Python form: $target_python_version)"

          cargo_version="$(grep -E '^version = "' Cargo.toml | head -1 | cut -d'"' -f2)"
          if [ "$cargo_version" != "$target_version" ]; then
            echo "::error::Cargo.toml version mismatch: expected $target_version, got $cargo_version"
            exit 1
          fi

          npm_version="$(jq -r '.version' npm-package/package.json)"
          if [ "$npm_version" != "$target_version" ]; then
            echo "::error::npm-package/package.json version mismatch: expected $target_version, got $npm_version"
            exit 1
          fi

          pypi_version="$(grep -E '^version = "' pip-package/pyproject.toml | head -1 | cut -d'"' -f2)"
          if [ "$pypi_version" != "$target_python_version" ]; then
            echo "::error::pip-package/pyproject.toml version mismatch: expected $target_python_version, got $pypi_version"
            exit 1
          fi

          init_version="$(grep -E '^__version__ = "' pip-package/uncomment/__init__.py | cut -d'"' -f2)"
          if [ "$init_version" != "$target_python_version" ]; then
            echo "::error::pip-package/uncomment/__init__.py version mismatch: expected $target_python_version, got $init_version"
            exit 1
          fi

          echo "✓ All version surfaces match: $target_version"

      - name: Detect already-published versions
        id: published
        run: |
          version="${{ steps.version.outputs.version }}"
          python_version="${{ steps.version.outputs.python_version }}"

          crates_exists=false
          if curl -fsS "https://crates.io/api/v1/crates/uncomment/${version}" >/dev/null; then
            crates_exists=true
          fi

          npm_exists=false
          if pnpm view "uncomment-cli@${version}" version >/dev/null 2>&1; then
            npm_exists=true
          fi

          pypi_exists=false
          if curl -fsS "https://pypi.org/pypi/uncomment/${python_version}/json" >/dev/null; then
            pypi_exists=true
          fi

          {
            echo "crates_exists=$crates_exists"
            echo "npm_exists=$npm_exists"
            echo "pypi_exists=$pypi_exists"
          } >> "$GITHUB_OUTPUT"

          echo "Already published?"
          echo "  crates.io: $crates_exists"
          echo "  npm:       $npm_exists"
          echo "  PyPI:      $pypi_exists"

      - name: Detect existing GitHub release assets
        id: release_assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          release_assets_exist=false

          if gh release view "$tag" >/dev/null 2>&1; then
            assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
            release_assets_exist=true
            for asset in uncomment-x86_64-unknown-linux-gnu.tar.gz uncomment-aarch64-unknown-linux-gnu.tar.gz \
              uncomment-aarch64-apple-darwin.tar.gz uncomment-x86_64-apple-darwin.tar.gz \
              uncomment-x86_64-pc-windows-gnu.zip; do
              if ! grep -Fxq "$asset" <<< "$assets"; then
                release_assets_exist=false
              fi
            done
          fi

          echo "release_assets_exist=$release_assets_exist" >> "$GITHUB_OUTPUT"
          echo "GitHub release assets exist? $release_assets_exist"

  create_release:
    name: Create GitHub release (draft)
    needs: meta
    if: >-
      !inputs.plugins-only && (needs.meta.outputs.release_assets_exist != 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Ensure the GitHub release exists as a draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
          else
            prerelease=""
            case "$tag" in
              *-rc.* | *-beta* | *-alpha*) prerelease="--prerelease" ;;
            esac
            gh release create "$tag" --title "$tag" --notes "Release $tag" --verify-tag --draft $prerelease
          fi

  build-macos:
    name: Build macOS / ${{ matrix.triple }}
    needs: [meta, create_release]
    if: >-
      !inputs.plugins-only && (needs.meta.outputs.release_assets_exist != 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: aarch64-apple-darwin
            os: macos-latest
          - triple: x86_64-apple-darwin
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: Setup cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.triple }}

      - name: Build release binary
        run: cargo build --release --bin uncomment --target "${{ matrix.triple }}"

      - name: Package archive
        run: |
          set -euo pipefail
          tar czf "uncomment-${{ matrix.triple }}.tar.gz" \
            -C "target/${{ matrix.triple }}/release" uncomment

      - name: Upload to GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.meta.outputs.tag }}" "uncomment-${{ matrix.triple }}.tar.gz" --clobber --repo "$GITHUB_REPOSITORY"

  build-windows:
    name: Build Windows / x86_64-pc-windows-gnu
    needs: [meta, create_release]
    if: >-
      !inputs.plugins-only && (needs.meta.outputs.release_assets_exist != 'true')
    runs-on: ubuntu-latest
    env:
      TRIPLE: x86_64-pc-windows-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 zip

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Setup cache
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-gnu

      - name: Build release binary
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
          CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
          AR_x86_64_pc_windows_gnu: x86_64-w64-mingw32-ar
        run: cargo build --release --bin uncomment --target x86_64-pc-windows-gnu

      - name: Package archive
        run: |
          set -euo pipefail
          zip -j "uncomment-${TRIPLE}.zip" "target/${TRIPLE}/release/uncomment.exe"

      - name: Upload to GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.meta.outputs.tag }}" "uncomment-${TRIPLE}.zip" --clobber --repo "$GITHUB_REPOSITORY"

  build-linux:
    name: Build Linux / ${{ matrix.triple }}
    needs: [meta, create_release]
    if: >-
      !inputs.plugins-only && (needs.meta.outputs.release_assets_exist != 'true')
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64:latest
          - triple: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Install Rust (in container)
        run: |
          set -euo pipefail
          # Pin CARGO_HOME/RUSTUP_HOME to absolute paths so a later container step
          # (which may not share $HOME) still finds the toolchain.
          export CARGO_HOME=/opt/cargo
          export RUSTUP_HOME=/opt/rustup
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "CARGO_HOME=/opt/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=/opt/rustup" >> "$GITHUB_ENV"
          echo "/opt/cargo/bin" >> "$GITHUB_PATH"

      - name: Install gh CLI (in container)
        run: |
          set -euo pipefail
          dnf install -y dnf-plugins-core
          dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo
          dnf install -y gh

      - name: Build release binary
        run: cargo build --release --bin uncomment --target "${{ matrix.triple }}"

      - name: Package archive
        run: |
          set -euo pipefail
          tar czf "uncomment-${{ matrix.triple }}.tar.gz" \
            -C "target/${{ matrix.triple }}/release" uncomment

      - name: Upload to GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The container runs as root but the workspace is owned by the runner uid;
          # gh shells out to git, which otherwise refuses with "dubious ownership".
          git config --global --add safe.directory "${GITHUB_WORKSPACE:-/__w/uncomment/uncomment}"
          gh release upload "${{ needs.meta.outputs.tag }}" \
            "uncomment-${{ matrix.triple }}.tar.gz" --clobber --repo "$GITHUB_REPOSITORY"

  checksums:
    if: ${{ !inputs.plugins-only }}
    name: Generate and upload checksums
    needs: [meta, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all 5 archives are present, then generate checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"
          version="${{ needs.meta.outputs.version }}"

          expected=(
            "uncomment-x86_64-unknown-linux-gnu.tar.gz"
            "uncomment-aarch64-unknown-linux-gnu.tar.gz"
            "uncomment-aarch64-apple-darwin.tar.gz"
            "uncomment-x86_64-apple-darwin.tar.gz"
            "uncomment-x86_64-pc-windows-gnu.zip"
          )

          # This job has no checkout, so gh cannot infer the repo from a .git dir;
          # pass --repo explicitly on every gh call.
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' > /tmp/assets.txt || true
          missing=0
          for asset in "${expected[@]}"; do
            if ! grep -qx "$asset" /tmp/assets.txt; then
              echo "::error::Missing expected archive: $asset"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::Release incomplete: $missing of 5 archives missing."
            exit 1
          fi
          echo "✓ All 5 archives present"

          for asset in "${expected[@]}"; do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p "$asset" -O "$asset"
          done
          sha256sum uncomment-*.tar.gz uncomment-*.zip | sort > "uncomment_${version}_checksums.txt"
          cat "uncomment_${version}_checksums.txt"
          gh release upload "$tag" "uncomment_${version}_checksums.txt" --clobber --repo "$GITHUB_REPOSITORY"

  plugin_assets:
    name: Package and upload verified coding-agent plugins
    needs: [meta, create_release]
    if: >-
      !inputs.plugins-only && (always() && needs.meta.result == 'success' && (needs.create_release.result == 'success' || needs.create_release.result == 'skipped'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.meta.outputs.tag }}
      - uses: xberg-io/actions/setup-ai-rulez@98adf87f1ed4c62a57ff56f9010d62faf42d4db6
        with:
          ai-rulez-version: "5.3.0"
          source-revision: "bdabc8a6e9211de60ca1e4ad76225ac92fcf218f"
      - name: Verify release version and public skills
        env:
          RELEASE_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          python3 scripts/sync_plugin_version.py --expect "$RELEASE_VERSION"
          python3 scripts/sync_public_skills.py --check
      - uses: xberg-io/actions/package-ai-rulez-plugin@66e9a172c28ae7e57496fe92de1ab74f2a604194
        with:
          tag: ${{ needs.meta.outputs.tag }}
          cursor-marketplace: "true"
      - name: Archive and upload the complete verified plugin distribution
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.meta.outputs.tag }}
          RELEASE_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_VERSION"
          archive="uncomment-plugins-${RELEASE_VERSION}.tar.gz"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf - -C dist/plugin . | gzip -n > "dist/$archive"
          (cd dist && sha256sum "$archive" > "$archive.sha256")
          gh release upload "$RELEASE_TAG" "dist/$archive" "dist/$archive.sha256" --clobber --repo "$GITHUB_REPOSITORY"

  finalize_release:
    name: Publish GitHub release
    needs: [meta, checksums, plugin_assets]
    if: >-
      !inputs.plugins-only && (always() && needs.meta.result == 'success' && needs.plugin_assets.result == 'success' && (needs.checksums.result == 'success' || needs.checksums.result == 'skipped'))
    runs-on: ubuntu-latest
    steps:
      - name: Promote draft to published once complete
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"
          version="${{ needs.meta.outputs.version }}"

          required=(
            "uncomment-x86_64-unknown-linux-gnu.tar.gz"
            "uncomment-aarch64-unknown-linux-gnu.tar.gz"
            "uncomment-aarch64-apple-darwin.tar.gz"
            "uncomment-x86_64-apple-darwin.tar.gz"
            "uncomment-x86_64-pc-windows-gnu.zip"
            "uncomment_${version}_checksums.txt"
          )

          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' > /tmp/assets.txt || true
          missing=0
          for asset in "${required[@]}"; do
            if ! grep -qx "$asset" /tmp/assets.txt; then
              echo "::error::release $tag is missing $asset"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::release $tag is incomplete ($missing assets missing); leaving it as a draft"
            exit 1
          fi

          gh release edit "$tag" --draft=false --repo "$GITHUB_REPOSITORY"
          echo "✓ Promoted $tag to a published release"

  float_major_tag:
    name: Float the major tag
    needs: [meta, finalize_release]
    # Consumers can use `uses: Goldziher/uncomment@v3`; point that tag at every stable release.
    # Pre-releases keep their own version tag only, so `v3` never resolves to an rc.
    if: >-
      !inputs.plugins-only && (always() && needs.meta.result == 'success' && needs.finalize_release.result == 'success' && !contains(needs.meta.outputs.version, '-rc') && !contains(needs.meta.outputs.version, '-beta') && !contains(needs.meta.outputs.version, '-alpha'))
    runs-on: ubuntu-latest
    steps:
      - name: Move the major tag onto this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"
          major="${tag%%.*}"

          # Dereference the (annotated) release tag to the commit the major tag should point at.
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha')"
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.type')" = "tag" ]; then
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.object.sha')"
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${major}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${major}" \
              -F sha="$sha" -F force=true >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${major}" -f sha="$sha" >/dev/null
          fi
          echo "✓ ${major} now points at ${tag} (${sha})"

  verify-binstall:
    name: Verify cargo-binstall install
    needs: [meta, finalize_release]
    # Gate mirrors the release-build jobs (skip when assets already exist) and waits for
    # finalize_release, which promotes the draft to a public release so cargo-binstall can
    # fetch the archives from their public download URLs (draft assets 404 for anon requests).
    if: >-
      !inputs.plugins-only && (needs.meta.outputs.release_assets_exist != 'true' && needs.finalize_release.result == 'success')
    uses: xberg-io/actions/.github/workflows/reusable-binstall-verify.yml@v1.24.1
    with:
      package-name: uncomment
      binary-name: uncomment
      manifest-path: .
      checkout-ref: ${{ needs.meta.outputs.tag }}
      # This repo ships a Windows x86_64-pc-windows-gnu archive, not the msvc default the
      # reusable workflow assumes, so the target matrix must be overridden explicitly.
      targets: |
        [
          {"os": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu"},
          {"os": "macos-latest", "target": "aarch64-apple-darwin"},
          {"os": "windows-latest", "target": "x86_64-pc-windows-gnu"}
        ]
      smoke-command: |
        uncomment --version

  publish_crates:
    name: Publish crates.io
    needs: [meta, build-macos, build-windows, build-linux]
    # A crates.io publish is irreversible, so it must not land before the release
    # archives exist: [package.metadata.binstall] resolves every version to those
    # download URLs, so a crate published without them is permanently broken for
    # cargo-binstall. `!= 'failure'` rather than `== 'success'` keeps the
    # already-have-assets path (where the build jobs are skipped) publishable.
    if: >-
      !inputs.plugins-only && (always() && needs.meta.result == 'success' && needs.meta.outputs.crates_exists != 'true' && needs.build-macos.result != 'failure' && needs.build-windows.result != 'failure' && needs.build-linux.result != 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate to crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: crates_auth

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_auth.outputs.token }}
        run: |
          set -euo pipefail
          if cargo publish --allow-dirty 2>cargo-publish.err; then
            exit 0
          fi

          if grep -Eq "crate .* already exists" cargo-publish.err; then
            echo "crate already published; skipping"
            exit 0
          fi

          cat cargo-publish.err >&2
          exit 1

  publish_npm:
    name: Publish npm
    needs: [meta, finalize_release]
    if: >-
      !inputs.plugins-only && (always() && needs.meta.outputs.npm_exists != 'true' && needs.finalize_release.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "12.11.2"
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          unset NODE_AUTH_TOKEN
          cd npm-package
          version="${{ needs.meta.outputs.version }}"
          if [[ "$version" == *"-rc."* ]]; then
            npm_tag="beta"
          else
            npm_tag="latest"
          fi

          pnpm publish --provenance --access public --tag "$npm_tag" --no-git-checks

  publish_pypi:
    name: Publish PyPI
    needs: [meta, finalize_release]
    if: >-
      !inputs.plugins-only && (always() && needs.meta.outputs.pypi_exists != 'true' && needs.finalize_release.result == 'success')
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build Python package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          cd pip-package
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pip-package/dist
          skip-existing: true

  publish_homebrew:
    name: Update Homebrew formula
    needs: [meta, finalize_release]
    if: >-
      !inputs.plugins-only && (always() && needs.finalize_release.result == 'success' && !contains(needs.meta.outputs.version, '-rc') && !contains(needs.meta.outputs.version, '-beta') && !contains(needs.meta.outputs.version, '-alpha'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Generate formula and push to tap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TOKEN:-}" ]; then
            echo "HOMEBREW_TOKEN not set — skipping the Homebrew formula update."
            exit 0
          fi
          tag="${{ needs.meta.outputs.tag }}"
          version="${{ needs.meta.outputs.version }}"
          gh release download "$tag" -p "uncomment_${version}_checksums.txt" -O checksums.txt
          ./scripts/update-homebrew-formula.sh "$version" checksums.txt > uncomment.rb

          git clone --depth 1 "https://x-access-token:${HOMEBREW_TOKEN}@github.com/Goldziher/homebrew-tap.git" tap
          cp uncomment.rb tap/Formula/uncomment.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/uncomment.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date."
          else
            git commit -m "uncomment ${version}"
            git push
          fi

  publish-plugin-opencode:
    name: Publish OpenCode and Pi plugin to npm
    needs: [plugin-meta, meta, finalize_release]
    if: >-
      always() && ((inputs.plugins-only && needs.plugin-meta.result == 'success')
      || (!inputs.plugins-only && needs.meta.result == 'success' && needs.finalize_release.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.plugins-only && github.sha || needs.meta.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install ai-rulez
        uses: xberg-io/actions/setup-ai-rulez@98adf87f1ed4c62a57ff56f9010d62faf42d4db6
        with:
          ai-rulez-version: "5.3.0"
          source-revision: "bdabc8a6e9211de60ca1e4ad76225ac92fcf218f"
      - name: Verify plugin versions and generated resources before publishing
        env:
          VERSION: ${{ needs.plugin-meta.outputs.version || needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/sync_plugin_version.py --expect "$VERSION"
          python3 scripts/sync_public_skills.py --check
          ai-rulez verify --plugin
      - name: Verify packed OpenCode and Pi resources
        shell: bash
        run: |
          set -euo pipefail
          pack_dir="$(mktemp -d)"
          npm pack ./plugin --ignore-scripts --json --pack-destination "$pack_dir" > "$pack_dir/pack.json"
          node - "$pack_dir/pack.json" <<'NODE'
          const fs = require('node:fs');
          const pkg = require('./plugin/package.json');
          const packed = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (packed.length !== 1) throw new Error('Expected exactly one packed plugin');
          if (pkg.name !== '@goldziher/opencode-uncomment' || packed[0].version !== pkg.version) {
            throw new Error('Unexpected npm plugin identity or version');
          }
          const files = packed[0].files.map(file => file.path);
          if (!files.includes(pkg.exports['.'].replace(/^\.\//, ''))) {
            throw new Error('OpenCode entry point was not packed');
          }
          if (!pkg.keywords.includes('pi-package') || !pkg.pi.skills.length) {
            throw new Error('Missing Pi package metadata');
          }
          for (const resource of [...pkg.pi.skills, ...pkg.pi.prompts]) {
            const relative = resource.replace(/^\.\//, '').replace(/\/$/, '');
            if (!files.some(path => path === relative || path.startsWith(`${relative}/`))) {
              throw new Error(`Declared Pi resource was not packed: ${resource}`);
            }
          }
          for (const resource of pkg.pi.skills) {
            const relative = resource.replace(/^\.\//, '').replace(/\/$/, '');
            for (const file of ['SKILL.md', 'index.md', 'references/configuration.md', 'references/library.md']) {
              if (!files.includes(`${relative}/${file}`)) throw new Error(`Missing packed Pi file: ${file}`);
            }
          }
          console.log(`Verified ${files.length} packed files and ${pkg.pi.skills.length} Pi skills`);
          NODE
      - name: Check the exact npm plugin version
        id: npm-version
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          package = json.loads(Path('plugin/package.json').read_text())
          name = urllib.parse.quote(package['name'], safe='@')
          version = urllib.parse.quote(package['version'], safe='')
          try:
              with urllib.request.urlopen(f'https://registry.npmjs.org/{name}/{version}', timeout=30) as response:
                  metadata = json.load(response)
              if metadata['name'] != package['name'] or metadata['version'] != package['version']:
                  raise SystemExit('npm registry returned an unexpected version')
              exists = True
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              exists = False
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'exists={str(exists).lower()}\n')
          print(f"npm {package['name']}@{package['version']}: {'already published; skipping' if exists else 'missing'}")
          PY
      - name: Publish verified npm package
        if: steps.npm-version.outputs.exists != 'true'
        uses: xberg-io/actions/publish-npm@v1
        with:
          expected-version: ${{ needs.plugin-meta.outputs.version || needs.meta.outputs.version }}
          package-dir: plugin
          access: public
          npm-tag: ${{ contains(needs.plugin-meta.outputs.version || needs.meta.outputs.version, '-') && 'next' || 'latest' }}
          provenance: "true"

  publish-plugin-hermes:
    name: Publish Hermes plugin to PyPI
    needs: [plugin-meta, meta, finalize_release]
    if: >-
      always() && ((inputs.plugins-only && needs.plugin-meta.result == 'success')
      || (!inputs.plugins-only && needs.meta.result == 'success' && needs.finalize_release.result == 'success'))
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.plugins-only && github.sha || needs.meta.outputs.tag }}
          fetch-depth: 0
      - name: Install ai-rulez
        uses: xberg-io/actions/setup-ai-rulez@98adf87f1ed4c62a57ff56f9010d62faf42d4db6
        with:
          ai-rulez-version: "5.3.0"
          source-revision: "bdabc8a6e9211de60ca1e4ad76225ac92fcf218f"
      - name: Verify plugin versions and generated resources before publishing
        env:
          VERSION: ${{ needs.plugin-meta.outputs.version || needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/sync_plugin_version.py --expect "$VERSION"
          python3 scripts/sync_public_skills.py --check
          ai-rulez verify --plugin
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
      - name: Read the verified Hermes package version
        id: wheel-version
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path('plugin/.hermes/package/pyproject.toml').read_text())['project']
          if project['name'] != 'uncomment-hermes-plugin' or not project['version']:
              raise SystemExit('Missing or unexpected Hermes package identity')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"version={project['version']}\n")
          PY
      - name: Build Hermes wheel
        run: uv build --wheel --out-dir dist-hermes plugin/.hermes/package
      - name: Verify installed Hermes wheel resources
        run: |
          python3 - <<'PY'
          import email
          import tomllib
          import zipfile
          from pathlib import Path

          project = tomllib.loads(Path('plugin/.hermes/package/pyproject.toml').read_text())['project']
          wheels = list(Path('dist-hermes').glob('*.whl'))
          assert len(wheels) == 1, f"Expected one Hermes wheel, found {len(wheels)}"
          source = Path('plugin/.hermes/package/src/uncomment_hermes_plugin')
          with zipfile.ZipFile(wheels[0]) as wheel:
              metadata_files = [path for path in wheel.namelist() if path.endswith('.dist-info/METADATA')]
              assert len(metadata_files) == 1, 'Expected one wheel metadata record'
              metadata = email.message_from_bytes(wheel.read(metadata_files[0]))
              assert metadata['Name'] == project['name'] and metadata['Version'] == project['version']
              files = [path for path in source.rglob('*') if path.is_file() and '__pycache__' not in path.parts]
              assert len(files) == 7, f"Expected seven Hermes package files, found {len(files)}"
              for path in files:
                  name = 'uncomment_hermes_plugin/' + path.relative_to(source).as_posix()
                  assert wheel.read(name) == path.read_bytes(), f"Changed or missing wheel resource: {name}"
          print(f"Verified one Hermes wheel and {len(files)} exact runtime/resource files")
          PY
      - name: Publish verified Hermes wheel
        uses: xberg-io/actions/publish-pypi@v1
        with:
          expected-version: ${{ steps.wheel-version.outputs.version }}
          packages-dir: dist-hermes

  plugin-release-report:
    name: Verify requested plugin distribution jobs succeeded
    needs: [plugin_assets, publish-plugin-opencode, publish-plugin-hermes]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Reject incomplete plugin distribution
        env:
          RESULTS_JSON: ${{ toJSON(needs) }}
          PLUGINS_ONLY: ${{ inputs.plugins-only }}
        run: |
          python3 - <<'PY'
          import json
          import os

          results = json.loads(os.environ['RESULTS_JSON'])
          expected = {'plugin_assets', 'publish-plugin-opencode', 'publish-plugin-hermes'}
          if set(results) != expected:
              raise SystemExit('Expected exactly three plugin distribution jobs')
          for name, job in results.items():
              wanted = 'skipped' if name == 'plugin_assets' and os.environ['PLUGINS_ONLY'] == 'true' else 'success'
              if job['result'] != wanted:
                  raise SystemExit(f"Incomplete plugin distribution: {name}={job['result']}, expected {wanted}")
          print('Verified all three requested plugin job outcomes')
          PY
