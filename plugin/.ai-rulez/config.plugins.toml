[plugin]
name = "uncomment"
version = "3.10.3"
display_name = "Uncomment"
description = "Inventory, preserve and remove source comments with AST parsing. Skills only; install the Uncomment CLI separately."
repository = "https://github.com/Goldziher/uncomment"
license = "MIT"
category = "developer-tools"
keywords = ["comments", "tree-sitter", "code-cleanup", "linting"]
include = ["assets/**", "README.md"]
runtimes = [
  "claude",
  "cursor",
  "codex",
  "gemini",
  "kimi",
  "opencode",
  "factory",
  "hermes",
  "pi",
  "agent-plugins",
  "copilot",
]
[plugin.author]
name = "Goldziher"
[plugin.interface]
display_name = "Uncomment"
short_description = "AST-based source comment cleanup"
long_description = "Skills for comment inventories, preservation markers, selective cleanup, linting and removal gates. Requires a separately installed Uncomment CLI; no MCP server is provided."
developer_name = "Goldziher"
category = "developer-tools"
capabilities = ["Read", "Write"]
default_prompt = ["Preview source comment removal with Uncomment", "Preserve the selected comments before cleanup"]
[plugin.codex]
manifest = "both"
marketplace = true
[plugin.cursor]
marketplace = true
[plugin.gemini]
context_file_name = "assets/GEMINI.md"
[plugin.pi]
package_json = "merge"
